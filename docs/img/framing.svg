<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-label="Client gửi hai message BID. Trên đường truyền chúng thành một dòng byte. Server recv lần một nhận BID|1|510000 xuống dòng BID|1|52, lần hai nhận 0000 xuống dòng. Buffer cắt tại ký tự xuống dòng: message 1 xử lý, phần BID|1|52 giữ lại, ghép với lần sau thành message 2.">
<style>
text { font-family: "Segoe UI", "Be Vietnam Pro", Arial, sans-serif; }
.box { fill: #ffffff; stroke: #c7cfda; stroke-width: 1; }
.box2 { fill: #eef1f5; stroke: #c7cfda; stroke-width: 1; }
.box-acc { fill: #fdf1e3; stroke: #b45309; stroke-width: 1.2; }
.box-dash { fill: none; stroke: #5b6675; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire { stroke: #1b2430; stroke-width: 1.5; fill: none; }
.head { fill: #1b2430; }
.s-tb { fill: #1b2430; font-size: 13.5px; font-weight: 600; }
.s-tm { fill: #5b6675; font-size: 11.5px; }
.s-code { fill: #1b2430; font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.s-code, .s-code-acc, .tmono { font-family: Consolas, "JetBrains Mono", monospace; }
</style>
<rect x="0" y="0" width="600" height="310" fill="#ffffff"/>
          <defs>
            <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
          </defs>
          <text x="160" y="46" class="s-tb" text-anchor="end">Client gửi</text>
          <text x="160" y="62" class="s-tm" text-anchor="end">2 lần send()</text>
          <rect x="180" y="30" width="130" height="32" rx="4" class="box"/><text x="245" y="51" class="s-code" text-anchor="middle">BID|1|510000\n</text>
          <rect x="318" y="30" width="130" height="32" rx="4" class="box"/><text x="383" y="51" class="s-code" text-anchor="middle">BID|1|520000\n</text>

          <text x="160" y="116" class="s-tb" text-anchor="end">Đường truyền</text>
          <text x="160" y="132" class="s-tm" text-anchor="end">1 dòng byte liền</text>
          <rect x="180" y="100" width="268" height="32" rx="4" class="box2"/><text x="314" y="121" class="s-code" text-anchor="middle">BID|1|510000\nBID|1|520000\n</text>

          <text x="160" y="186" class="s-tb" text-anchor="end">Server nhận</text>
          <text x="160" y="202" class="s-tm" text-anchor="end">2 lần recv()</text>
          <text x="182" y="164" class="s-tm">recv lần 1</text>
          <text x="370" y="164" class="s-tm">lần 2</text>
          <rect x="180" y="170" width="180" height="32" rx="4" class="box"/><text x="270" y="191" class="s-code" text-anchor="middle">BID|1|510000\nBID|1|52</text>
          <rect x="368" y="170" width="80" height="32" rx="4" class="box"/><text x="408" y="191" class="s-code" text-anchor="middle">0000\n</text>

          <text x="160" y="256" class="s-tb" text-anchor="end">Buffer, cắt tại \n</text>
          <text x="160" y="272" class="s-tm" text-anchor="end">mỗi client một buffer</text>
          <rect x="180" y="240" width="112" height="32" rx="4" class="box-acc"/><text x="236" y="261" class="s-code" text-anchor="middle">BID|1|510000</text>
          <text x="180" y="292" class="s-tm">message 1 → xử lý</text>
          <rect x="304" y="240" width="72" height="32" rx="4" class="box-dash"/><text x="340" y="261" class="s-code" text-anchor="middle">BID|1|52</text>
          <text x="304" y="292" class="s-tm">giữ lại</text>
          <line x1="382" y1="256" x2="426" y2="256" class="wire" marker-end="url(#m3)"/>
          <text x="404" y="248" class="s-tm" text-anchor="middle">+ lần 2</text>
          <rect x="430" y="240" width="112" height="32" rx="4" class="box-acc"/><text x="486" y="261" class="s-code" text-anchor="middle">BID|1|520000</text>
          <text x="430" y="292" class="s-tm">message 2 → xử lý</text>
        </svg>
