<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="Sơ đồ tuần tự: Bình gửi BID 850000 lên server. Server kiểm tra luật, trả OK_BID cho Bình, rồi gửi EVT_NEW_BID cho cả Bình và Chi. Chi không gửi gì nhưng vẫn nhận event.">
<style>
text { font-family: "Segoe UI", "Be Vietnam Pro", Arial, sans-serif; }
.box { fill: #ffffff; stroke: #c7cfda; stroke-width: 1; }
.box2 { fill: #eef1f5; stroke: #c7cfda; stroke-width: 1; }
.life { stroke: #5b6675; stroke-width: 1; stroke-dasharray: 3 4; }
.wire { stroke: #1b2430; stroke-width: 1.5; fill: none; }
.wire-acc { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
.head { fill: #1b2430; }
.head-acc { fill: #b45309; }
.s-t { fill: #1b2430; font-size: 12.5px; }
.s-tb { fill: #1b2430; font-size: 13.5px; font-weight: 600; }
.s-tm { fill: #5b6675; font-size: 11.5px; }
.s-code { fill: #1b2430; font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.s-code-acc { fill: #b45309; font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.s-acc { fill: #b45309; font-size: 12px; font-weight: 600; }
.s-code, .s-code-acc, .tmono { font-family: Consolas, "JetBrains Mono", monospace; }
</style>
<rect x="0" y="0" width="720" height="262" fill="#ffffff"/>
          <defs>
            <marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
            <marker id="m4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-acc"/></marker>
          </defs>
          <rect x="40" y="12" width="140" height="36" rx="6" class="box2"/><text x="110" y="35" class="s-tb" text-anchor="middle">Bình (client)</text>
          <rect x="290" y="12" width="140" height="36" rx="6" class="box2"/><text x="360" y="35" class="s-tb" text-anchor="middle">Server</text>
          <rect x="540" y="12" width="140" height="36" rx="6" class="box2"/><text x="610" y="35" class="s-tb" text-anchor="middle">Chi (client)</text>
          <line x1="110" y1="48" x2="110" y2="256" class="life"/>
          <line x1="360" y1="48" x2="360" y2="256" class="life"/>
          <line x1="610" y1="48" x2="610" y2="256" class="life"/>

          <line x1="110" y1="88" x2="356" y2="88" class="wire" marker-end="url(#m4)"/>
          <text x="234" y="80" class="s-code" text-anchor="middle">BID|1|850000</text>

          <rect x="290" y="104" width="140" height="42" rx="4" class="box"/>
          <text x="360" y="122" class="s-t" text-anchor="middle">kiểm tra luật</text>
          <text x="360" y="139" class="s-tm" text-anchor="middle">giá mới = 850.000</text>

          <line x1="360" y1="176" x2="114" y2="176" class="wire" marker-end="url(#m4)"/>
          <text x="236" y="168" class="s-code" text-anchor="middle">OK_BID|1|850000</text>
          <text x="236" y="194" class="s-tm" text-anchor="middle">response: chỉ gửi người hỏi</text>

          <line x1="360" y1="226" x2="114" y2="226" class="wire-acc" marker-end="url(#m4a)"/>
          <text x="236" y="218" class="s-code-acc" text-anchor="middle">EVT_NEW_BID|…|850000|binh</text>
          <line x1="360" y1="226" x2="606" y2="226" class="wire-acc" marker-end="url(#m4a)"/>
          <text x="484" y="218" class="s-code-acc" text-anchor="middle">EVT_NEW_BID|…|850000|binh</text>
          <text x="484" y="246" class="s-acc" text-anchor="middle">Chi không hỏi gì vẫn nhận</text>
        </svg>
