<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620" role="img" aria-label="Kiến trúc client-server: nhiều client Python PySide6, mỗi client có luồng GUI và luồng mạng, nối qua một kết nối TCP với server C một luồng dùng select(). Server có bộ đệm nhận và gửi cho từng client, parser, các module nghiệp vụ, lưu trữ file và log. Một lượt BID đi từ GUI qua socket vào recv buffer, parser, module đấu giá, rồi send buffer gửi OK_BID cho người trả giá và EVT_NEW_BID cho cả phòng.">
<style>
text { font-family: "Segoe UI", "Be Vietnam Pro", Arial, sans-serif; }
.f-client { fill: #e8eff9; stroke: #9fb4d3; stroke-width: 1.2; }
.f-server { fill: #edf2e8; stroke: #a7bb98; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #c7cfda; stroke-width: 1; }
.box-acc { fill: #fdf1e3; stroke: #b45309; stroke-width: 1.2; }
.outline { fill: none; stroke: #5b6675; stroke-width: 1; stroke-dasharray: 4 3; }
.t { fill: #1b2430; font-size: 12px; }
.tb { fill: #1b2430; font-size: 13px; font-weight: 600; }
.th { fill: #1b2430; font-size: 15px; font-weight: 700; }
.tm { fill: #5b6675; font-size: 11.5px; }
.tmono { fill: #1b2430; font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10.5px; }
.tacc { fill: #b45309; font-size: 11.5px; font-weight: 600; }
.wire { stroke: #1b2430; stroke-width: 1.5; fill: none; }
.wire-acc { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
.wire-thin { stroke: #5b6675; stroke-width: 1.2; fill: none; }
.head { fill: #1b2430; }
.head-acc { fill: #b45309; }
.head-thin { fill: #5b6675; }
.step circle { fill: #b45309; }
.step text { fill: #ffffff; font-size: 10.5px; font-weight: 700; }
.s-code, .s-code-acc, .tmono { font-family: Consolas, "JetBrains Mono", monospace; }
</style>
<rect x="0" y="0" width="1060" height="620" fill="#ffffff"/>
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="head"/>
          </marker>
          <marker id="arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="head-acc"/>
          </marker>
          <marker id="arr-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="head-thin"/>
          </marker>
        </defs>

        <!-- ===== CLIENT ===== -->
        <rect x="16" y="40" width="344" height="560" rx="10" class="f-client"/>
        <text x="32" y="68" class="th">Client × N</text>
        <text x="122" y="68" class="tm">Python 3 · PySide6</text>

        <!-- GUI thread -->
        <rect x="32" y="84" width="246" height="236" rx="6" class="box"/>
        <text x="44" y="106" class="tb">Luồng GUI</text>
        <text x="44" y="122" class="tm">Qt event loop</text>
        <rect x="44" y="136" width="222" height="30" rx="4" class="box"/>
        <text x="56" y="155" class="t">Đăng nhập · Đăng ký</text>
        <rect x="44" y="174" width="222" height="30" rx="4" class="box"/>
        <text x="56" y="193" class="t">Sảnh: phòng, tìm kiếm, lịch sử</text>
        <rect x="44" y="212" width="222" height="30" rx="4" class="box-acc"/>
        <text x="56" y="231" class="t">Phòng: giá, đếm ngược, BID</text>
        <rect x="44" y="250" width="222" height="30" rx="4" class="box"/>
        <text x="56" y="269" class="t">Chủ phòng: vật phẩm, bắt đầu</text>
        <text x="44" y="304" class="tm">QTimer tự đếm ngược từ deadline</text>

        <!-- Network thread -->
        <rect x="32" y="370" width="246" height="120" rx="6" class="box"/>
        <text x="44" y="392" class="tb">Luồng mạng</text>
        <text x="44" y="408" class="tm">QThread, chờ ở recv()</text>
        <text x="44" y="434" class="t">ghép byte, cắt dòng tại \n</text>
        <text x="44" y="454" class="t">OK_ / ERR → request đang chờ</text>
        <text x="44" y="474" class="t">EVT_* → cập nhật màn hình</text>

        <!-- Signal -->
        <line x1="100" y1="370" x2="100" y2="322" class="wire" marker-end="url(#arr)"/>
        <text x="110" y="350" class="tmono">Signal(msg)</text>

        <!-- socket bar -->
        <rect x="310" y="96" width="40" height="394" rx="4" class="box"/>
        <text x="330" y="293" class="tb" text-anchor="middle" transform="rotate(-90 330 293)">socket TCP</text>

        <!-- GUI -> socket, socket -> net thread -->
        <line x1="278" y1="196" x2="308" y2="196" class="wire" marker-end="url(#arr)"/>
        <line x1="310" y1="430" x2="280" y2="430" class="wire" marker-end="url(#arr)"/>
        <text x="294" y="422" class="tm" text-anchor="middle">recv</text>

        <text x="32" y="534" class="tm">Mạng: module socket chuẩn của Python</text>
        <text x="32" y="552" class="tm">(không dùng QTcpSocket, WebSocket)</text>

        <!-- ===== WIRE ===== -->
        <text x="420" y="110" class="tb" text-anchor="middle">TCP</text>
        <text x="420" y="126" class="tm" text-anchor="middle">1 kết nối bền / client</text>

        <text x="420" y="188" class="tb" text-anchor="middle" style="font-size:12px">Request</text>
        <line x1="350" y1="196" x2="488" y2="196" class="wire" marker-end="url(#arr)"/>
        <text x="420" y="212" class="tmono" text-anchor="middle">BID|1|510000</text>

        <text x="420" y="272" class="tb" text-anchor="middle" style="font-size:12px">Response</text>
        <line x1="490" y1="280" x2="352" y2="280" class="wire" marker-end="url(#arr)"/>
        <text x="420" y="296" class="tmono" text-anchor="middle">OK_BID|1|510000</text>

        <text x="420" y="314" class="tacc" text-anchor="middle">Event · tự đẩy</text>
        <line x1="490" y1="322" x2="352" y2="322" class="wire-acc" marker-end="url(#arr-acc)"/>
        <text x="420" y="338" class="tmono" text-anchor="middle">EVT_NEW_BID|…</text>

        <text x="420" y="407" class="tmono" text-anchor="middle">connect()</text>
        <line x1="350" y1="415" x2="488" y2="415" class="wire-thin" marker-end="url(#arr-thin)"/>

        <text x="420" y="468" class="tm" text-anchor="middle">mỗi message 1 dòng</text>
        <text x="420" y="486" class="tmono" text-anchor="middle">CMD|f1|f2\n</text>
        <text x="420" y="502" class="tm" text-anchor="middle">tối đa 4096 byte</text>

        <!-- ===== SERVER ===== -->
        <rect x="470" y="40" width="574" height="560" rx="10" class="f-server"/>
        <text x="490" y="68" class="th">Server</text>
        <text x="550" y="68" class="tm">C · Linux · 1 tiến trình, 1 luồng</text>

        <!-- select loop -->
        <rect x="490" y="84" width="514" height="56" rx="6" class="box"/>
        <text x="504" y="106" class="tb">Vòng lặp select()</text>
        <text x="504" y="126" class="tm">đánh thức khi: có dữ liệu đến · socket ghi được · tới deadline gần nhất</text>

        <!-- per-client struct -->
        <rect x="482" y="154" width="206" height="192" rx="8" class="outline"/>
        <rect x="490" y="164" width="190" height="64" rx="6" class="box"/>
        <text x="502" y="188" class="tb">recv buffer</text>
        <text x="502" y="208" class="t">ghép byte, cắt dòng tại \n</text>
        <rect x="490" y="262" width="190" height="74" rx="6" class="box"/>
        <text x="502" y="284" class="tb">send buffer</text>
        <text x="502" y="303" class="t">OK / ERR cho người gửi</text>
        <text x="502" y="321" class="t">EVT_* cho cả phòng</text>
        <text x="490" y="366" class="tm">struct client × N (fd, user, phòng)</text>

        <!-- listen socket -->
        <rect x="490" y="392" width="190" height="50" rx="6" class="box"/>
        <text x="502" y="412" class="tb">listen socket</text>
        <text x="502" y="430" class="t">accept() → thêm client</text>
        <line x1="650" y1="392" x2="650" y2="348" class="wire-thin" marker-end="url(#arr-thin)"/>
        <text x="658" y="384" class="tm">tạo</text>

        <!-- parser -->
        <rect x="720" y="164" width="284" height="64" rx="6" class="box"/>
        <text x="732" y="188" class="tb">Parser + dispatcher</text>
        <text x="732" y="208" class="t">tách |, bỏ escape, gọi module theo lệnh</text>
        <line x1="680" y1="196" x2="718" y2="196" class="wire" marker-end="url(#arr)"/>

        <!-- modules -->
        <line x1="862" y1="228" x2="862" y2="246" class="wire" marker-end="url(#arr)"/>
        <rect x="720" y="248" width="284" height="240" rx="6" class="box"/>
        <text x="732" y="270" class="tb" style="font-size:12px">Module nghiệp vụ</text>

        <rect x="732" y="282" width="260" height="32" rx="4" class="box"/>
        <text x="744" y="302" class="t">Tài khoản &amp; phiên</text>
        <text x="980" y="302" class="tmono" text-anchor="end">REGISTER · LOGIN</text>

        <rect x="732" y="322" width="260" height="32" rx="4" class="box"/>
        <text x="744" y="342" class="t">Phòng</text>
        <text x="980" y="342" class="tmono" text-anchor="end">CREATE · JOIN · LEAVE</text>

        <rect x="732" y="362" width="260" height="32" rx="4" class="box"/>
        <text x="744" y="382" class="t">Vật phẩm &amp; hàng đợi</text>
        <text x="980" y="382" class="tmono" text-anchor="end">ADD · DEL · LIST</text>

        <rect x="732" y="402" width="260" height="32" rx="4" class="box-acc"/>
        <text x="744" y="422" class="t" style="font-weight:600">Đấu giá &amp; đồng hồ</text>
        <text x="980" y="422" class="tmono" text-anchor="end">BID · BUY_NOW</text>

        <rect x="732" y="442" width="260" height="32" rx="4" class="box"/>
        <text x="744" y="462" class="t">Tìm kiếm &amp; lịch sử</text>
        <text x="980" y="462" class="tmono" text-anchor="end">SEARCH · HISTORY</text>

        <!-- auction -> send buffer -->
        <polyline points="732,418 702,418 702,300 682,300" class="wire-acc" marker-end="url(#arr-acc)"/>

        <!-- timer path: select timeout -> auction -->
        <polyline points="1004,112 1018,112 1018,418 994,418" class="wire-thin" marker-end="url(#arr-thin)"/>
        <text x="1032" y="265" class="tm" text-anchor="middle" transform="rotate(90 1032 265)">timeout → cảnh báo 30s / đóng món</text>

        <!-- storage + log -->
        <line x1="770" y1="488" x2="770" y2="518" class="wire-thin" marker-end="url(#arr-thin)"/>
        <text x="778" y="508" class="tm">đọc / ghi</text>
        <line x1="920" y1="488" x2="920" y2="518" class="wire-thin" marker-end="url(#arr-thin)"/>
        <text x="928" y="508" class="tm">ghi log</text>
        <rect x="490" y="520" width="330" height="56" rx="6" class="box"/>
        <text x="502" y="542" class="tb">Lưu trữ file</text>
        <text x="502" y="562" class="t">users · rooms · items · bids · meta</text>
        <rect x="840" y="520" width="164" height="56" rx="6" class="box"/>
        <text x="852" y="542" class="tb">server.log</text>
        <text x="852" y="562" class="t">mọi hoạt động</text>

        <!-- step markers for one BID -->
        <g class="step"><circle cx="294" cy="180" r="9"/><text x="294" y="184" text-anchor="middle">1</text></g>
        <g class="step"><circle cx="700" cy="180" r="9"/><text x="700" y="184" text-anchor="middle">2</text></g>
        <g class="step"><circle cx="880" cy="237" r="9"/><text x="880" y="241" text-anchor="middle">3</text></g>
        <g class="step"><circle cx="702" cy="360" r="9"/><text x="702" y="364" text-anchor="middle">4</text></g>
        <g class="step"><circle cx="84" cy="346" r="9"/><text x="84" y="350" text-anchor="middle">5</text></g>
      </svg>
